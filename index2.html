<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kaba Adime - Single Player</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: url('https://i.ibb.co/qYWhy6XH/sinhala-tamil-new-year-design-600nw-2590903529.webp') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.85);
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    h1 {
      color: #222;
    }

    .scoreboard {
      margin: 20px 0;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #008000;
      color: white;
      border: none;
      border-radius: 8px;
      transition: transform 0.2s;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.95);
    }

    .result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .rope-animation {
      font-size: 50px;
      margin: 20px 0;
    }

    .bird {
      position: absolute;
      top: 100px;
      width: 50px;
      height: auto;
      animation: flyBird 15s linear infinite;
    }

    .bird:nth-child(1) { top: 80px; animation-delay: 0s; }
    .bird:nth-child(2) { top: 140px; animation-delay: 5s; }
    .bird:nth-child(3) { top: 200px; animation-delay: 10s; }

    @keyframes flyBird {
      0% { left: -60px; transform: scaleX(1); }
      50% { transform: scaleX(1.2); }
      100% { left: 110%; transform: scaleX(1); }
    }

    /* Floating Music Button on Side */
    #musicToggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #f39c12;
      color: white;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    #musicToggle:hover {
      background-color: #e67e22;
    }

  </style>
</head>
<body>

  <!-- Flying Birds -->
  <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExemhnMGN1bXU2cjAydGRsZXB4b21tbWtmb3BsM2RjbnNvdzRvN3piYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/apjjqxY50XYlnF75YP/giphy.gif" class="bird" />
  <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExemhnMGN1bXU2cjAydGRsZXB4b21tbWtmb3BsM2RjbnNvdzRvN3piYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/apjjqxY50XYlnF75YP/giphy.gif" class="bird" />
  <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExemhnMGN1bXU2cjAydGRsZXB4b21tbWtmb3BsM2RjbnNvdzRvN3piYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/apjjqxY50XYlnF75YP/giphy.gif" class="bird" />

  <div class="container">
    <h1>කබ අදිමේ (Kaba Adime)</h1>
    <p>Single Player - Tug of War vs Computer</p>

    <div class="scoreboard">
      <p>🧍 You: <span id="myScore">0</span></p>
      <p>🤖 Computer: <span id="opponentScore">0</span></p>
    </div>

    <div class="rope-animation" id="rope">🤜🏽-----💢-----🤛🏽</div>

    <button onclick="playRound()">Pull!</button>

    <div class="result" id="resultText">Click "Pull!" to start</div>
  </div>

  <!-- Music Toggle Button (floating) -->
  <button id="musicToggle" onclick="toggleMusic()">🎵 Play Music</button>

  <!-- Sounds -->
  <audio id="bgMusic" src="https://audio.jukehost.co.uk/api/external/download/r0sVyB76TQkkCaHIQmhryywYnmnS9kpb" loop></audio>
  <audio id="pullSound" src="https://cdn.pixabay.com/download/audio/2024/04/02/audio_f9ea5aad6a.mp3?filename=rope-tighten-knot-14-199797.mp3"></audio>
  <audio id="winSound" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_2722574464.mp3?filename=badge-coin-win-14675.mp3"></audio>

  <script>
    let myScore = 0;
    let opponentScore = 0;
    let musicPlaying = false;

    function playRound() {
      const resultText = document.getElementById("resultText");
      const rope = document.getElementById("rope");

      const myStrength = Math.floor(Math.random() * 100) + 1;
      const computerStrength = Math.floor(Math.random() * 100) + 1;

      document.getElementById("pullSound").play();
     


      if (myStrength > computerStrength) {
        myScore++;
        resultText.textContent = `You win this round! 💪 (${myStrength} vs ${computerStrength})`;
        document.getElementById("winSound").play();
      } else if (computerStrength > myStrength) {
        opponentScore++;
        resultText.textContent = `Computer wins! 🤖 (${computerStrength} vs ${myStrength})`;
        document.getElementById("winSound").play();
      } else {
        resultText.textContent = `It's a tie! 🤝 (${myStrength} vs ${computerStrength})`;
      }

      document.getElementById("myScore").textContent = myScore;
      document.getElementById("opponentScore").textContent = opponentScore;
    }

    function toggleMusic() {
      const bgMusic = document.getElementById("bgMusic");
      const toggleBtn = document.getElementById("musicToggle");

      if (musicPlaying) {
        bgMusic.pause();
        toggleBtn.textContent = "🎵 Play Music";
      } else {
        bgMusic.play().catch(err => {
          console.log("Music autoplay blocked:", err);
        });
        toggleBtn.textContent = "🔇 Stop Music";
      }

      musicPlaying = !musicPlaying;
    }
  </script>
</body>
</html>
